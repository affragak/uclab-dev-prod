apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  parentRefs:
    - name: uclab-gateway
      namespace: gateway-system
  hostnames:
    - grafana.uclab.dev
  rules:
    - backendRefs:
        - name: kube-prometheus-stack-grafana
          port: 80
