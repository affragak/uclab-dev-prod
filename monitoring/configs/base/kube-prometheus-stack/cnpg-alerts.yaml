# CloudNativePG default alert rules.
# Source: cloudnative-pg/cloudnative-pg docs/src/samples/monitoring/prometheusrule.yaml
# Placed in the monitoring namespace and labeled release=kube-prometheus-stack so
# this cluster's Prometheus (ruleSelector matchLabels.release) discovers it.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cnpg-default-alerts
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: cnp-default.rules
      rules:
        - alert: LongRunningTransaction
          annotations:
            description: Pod {{ $labels.pod }} is taking more than 5 minutes (300 seconds) for a query.
            summary: A query is taking longer than 5 minutes.
          expr: |-
            cnpg_backends_max_tx_duration_seconds > 300
          for: 1m
          labels:
            severity: warning
        - alert: BackendsWaiting
          annotations:
            description: Pod {{ $labels.pod  }} has been waiting for longer than 5 minutes
            summary: If a backend is waiting for longer than 5 minutes
          expr: |-
            cnpg_backends_waiting_total > 300
          for: 1m
          labels:
            severity: warning
        - alert: PGDatabaseXidAge
          annotations:
            description: Over 300,000,000 transactions from frozen xid on pod {{ $labels.pod  }}
            summary: Number of transactions from the frozen XID to the current one
          expr: |-
            cnpg_pg_database_xid_age > 300000000
          for: 1m
          labels:
            severity: warning
        - alert: PGReplication
          annotations:
            description: Standby is lagging behind by over 300 seconds (5 minutes)
            summary: The standby is lagging behind the primary
          expr: |-
            cnpg_pg_replication_lag > 300
          for: 1m
          labels:
            severity: warning
        - alert: LastFailedArchiveTime
          annotations:
            description: Archiving failed for {{ $labels.pod }}
            summary: Checks the last time archiving failed. Will be < 0 when it has not failed.
          expr: |-
            (cnpg_pg_stat_archiver_last_failed_time - cnpg_pg_stat_archiver_last_archived_time) > 1
          for: 1m
          labels:
            severity: warning
        - alert: DatabaseDeadlockConflicts
          annotations:
            description: There are over 10 deadlock conflicts in {{ $labels.pod }}
            summary: Checks the number of database conflicts
          expr: |-
            cnpg_pg_stat_database_deadlocks > 10
          for: 1m
          labels:
            severity: warning
        - alert: ReplicaFailingReplication
          annotations:
            description: Replica {{ $labels.pod }} is failing to replicate
            summary: Checks if the replica is failing to replicate
          expr: |-
            cnpg_pg_replication_in_recovery > cnpg_pg_replication_is_wal_receiver_up
          for: 1m
          labels:
            severity: warning
    # Backup creation-rate detection, sourced from the kube_cnpg_backup_info
    # metric emitted by kube-state-metrics' customResourceState config for
    # postgresql.cnpg.io/v1 Backup (see
    # monitoring/controllers/base/kube-prometheus-stack/values.yaml).
    #
    # Context: ops holds create-only RBAC on backups.postgresql.cnpg.io
    # (no delete), with no rate limit enforced by RBAC. A retry loop in the
    # ops agent could spam base backups (DB load + MinIO growth). Normal rate
    # is 1 scheduled backup/day/cluster across forgejo-db-v1, linkding-db-v1,
    # n8n-db-v1. Backup CRs are never deleted by ops, so the per-namespace
    # count of kube_cnpg_backup_info is monotonic and its 1h delta equals the
    # number of Backup objects created in that window.
    - name: cnpg-backup-accounting.rules
      rules:
        - alert: CNPGBackupCreationRateHigh
          annotations:
            summary: Backup CRs are being created much faster than the 1/day/cluster schedule in {{ $labels.exported_namespace }}.
            description: |-
              {{ $value | humanize }} CloudNativePG Backup objects were created in namespace
              {{ $labels.exported_namespace }} in the last hour. Normal is one scheduled backup per
              cluster per day, so this strongly suggests a retry loop (e.g. the ops agent)
              repeatedly creating base backups — real DB load and MinIO growth within the
              retention window. Backups cannot be deleted by ops (no delete RBAC granted by
              design) — investigate and, if it's a stuck retry loop, a human must pause the
              source and manually prune the excess Backup objects.
          expr: |-
            count by (exported_namespace) (kube_cnpg_backup_info) - count by (exported_namespace) (kube_cnpg_backup_info offset 1h) > 3
          for: 5m
          labels:
            severity: warning
