# CloudNativePG default alert rules.
# Source: cloudnative-pg/cloudnative-pg docs/src/samples/monitoring/prometheusrule.yaml
# Placed in the monitoring namespace and labeled release=kube-prometheus-stack so
# this cluster's Prometheus (ruleSelector matchLabels.release) discovers it.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cnpg-default-alerts
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: cnp-default.rules
      rules:
        - alert: LongRunningTransaction
          annotations:
            description: Pod {{ $labels.pod }} is taking more than 5 minutes (300 seconds) for a query.
            summary: A query is taking longer than 5 minutes.
          expr: |-
            cnpg_backends_max_tx_duration_seconds > 300
          for: 1m
          labels:
            severity: warning
        - alert: BackendsWaiting
          annotations:
            description: Pod {{ $labels.pod  }} has been waiting for longer than 5 minutes
            summary: If a backend is waiting for longer than 5 minutes
          expr: |-
            cnpg_backends_waiting_total > 300
          for: 1m
          labels:
            severity: warning
        - alert: PGDatabaseXidAge
          annotations:
            description: Over 300,000,000 transactions from frozen xid on pod {{ $labels.pod  }}
            summary: Number of transactions from the frozen XID to the current one
          expr: |-
            cnpg_pg_database_xid_age > 300000000
          for: 1m
          labels:
            severity: warning
        - alert: PGReplication
          annotations:
            description: Standby is lagging behind by over 300 seconds (5 minutes)
            summary: The standby is lagging behind the primary
          expr: |-
            cnpg_pg_replication_lag > 300
          for: 1m
          labels:
            severity: warning
        - alert: LastFailedArchiveTime
          annotations:
            description: Archiving failed for {{ $labels.pod }}
            summary: Checks the last time archiving failed. Will be < 0 when it has not failed.
          expr: |-
            (cnpg_pg_stat_archiver_last_failed_time - cnpg_pg_stat_archiver_last_archived_time) > 1
          for: 1m
          labels:
            severity: warning
        - alert: DatabaseDeadlockConflicts
          annotations:
            description: There are over 10 deadlock conflicts in {{ $labels.pod }}
            summary: Checks the number of database conflicts
          expr: |-
            cnpg_pg_stat_database_deadlocks > 10
          for: 1m
          labels:
            severity: warning
        - alert: ReplicaFailingReplication
          annotations:
            description: Replica {{ $labels.pod }} is failing to replicate
            summary: Checks if the replica is failing to replicate
          expr: |-
            cnpg_pg_replication_in_recovery > cnpg_pg_replication_is_wal_receiver_up
          for: 1m
          labels:
            severity: warning
    - name: cnpg-backup-rate.rules
      rules:
        # Watches the barman-cloud plugin metrics (already scraped, already
        # labeled with a real Prometheus `namespace` target label) rather than
        # the in-tree collector's backup timestamp, which is always 0 here
        # because backups run via the barman-cloud plugin, not the in-tree
        # archiver/backup path. Detects backups that COMPLETE or FAIL, not
        # Backup CRs that are merely created: a CR stuck pending advances
        # neither timestamp. That's an accepted tradeoff, since a backup that
        # never runs causes neither the DB load nor the object-store growth
        # this alert exists to catch.
        - alert: CNPGBackupRateHigh
          annotations:
            description: >-
              Namespace {{ $labels.namespace }} has completed or failed more
              than 3 CNPG backups in the last hour. Normal is one scheduled
              backup per cluster per day, so this rate means something is
              triggering repeated backups - most likely a retry loop in the
              ops agent, which holds create-but-not-delete RBAC on Backup
              objects in this namespace. Each extra run costs real database
              load and grows MinIO usage inside the 3-day retention window.
              Investigate and stop the source; ops cannot delete backups by
              design, so this requires a human.
            summary: CNPG backup rate for {{ $labels.namespace }} is abnormally high.
          expr: |-
            max by (namespace) (
              changes(barman_cloud_cloudnative_pg_io_last_available_backup_timestamp[1h])
              + changes(barman_cloud_cloudnative_pg_io_last_failed_backup_timestamp[1h])
            ) > 3
          for: 10m
          labels:
            severity: warning
