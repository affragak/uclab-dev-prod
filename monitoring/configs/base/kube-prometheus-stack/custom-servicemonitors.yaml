# Cilium/Hubble metrics scraping.
#
# NOTE: Cilium's built-in ServiceMonitors are disabled in the Helm values
# (prometheus.serviceMonitor.enabled=false, etc.) because enabling them at
# CNI-install time requires the monitoring.coreos.com CRDs, which breaks a cold
# bootstrap (see the DR notes). But the metrics *Services* are still created by
# prometheus.enabled=true / hubble.metrics.enabled / operator.prometheus.enabled,
# so we own the ServiceMonitors here instead. Each metrics endpoint is a SEPARATE
# Service — one ServiceMonitor per Service, matching its exact labels/port name
# (verified with `kubectl -n kube-system get svc`):
#   svc/cilium-agent    k8s-app=cilium        port metrics        (:9962)
#   svc/hubble-metrics  k8s-app=hubble        port hubble-metrics (:9965)
#   svc/cilium-operator name=cilium-operator  port metrics        (:9963)
#   svc/cilium-envoy    k8s-app=cilium-envoy  port envoy-metrics  (:9964)
#
# Prometheus discovers these because kube-prometheus-stack sets
# serviceMonitorSelectorNilUsesHelmValues=false.
#
# targetLabels: [k8s-app] promotes the Service's `k8s-app` label onto every
# scraped series as `k8s_app`. The official Cilium/Hubble Grafana dashboards
# filter every query on `k8s_app="cilium"` / `k8s_app="hubble"`; without this
# the targets are Up but the dashboards render empty (no series match).

# Cilium agent (:9962)
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: cilium-agent
  namespace: monitoring
  labels:
    app.kubernetes.io/name: cilium
    release: kube-prometheus-stack
    prometheus: kube-prometheus-stack-prometheus
spec:
  selector:
    matchLabels:
      k8s-app: cilium
  targetLabels:
    - k8s-app
  namespaceSelector:
    matchNames:
      - kube-system
  endpoints:
    - port: metrics
      interval: 30s
      path: /metrics
---
# Hubble (:9965) — SEPARATE Service (k8s-app=hubble); this is the flow/L7 data
# that the Hubble dashboards need.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: hubble
  namespace: monitoring
  labels:
    app.kubernetes.io/name: hubble
    release: kube-prometheus-stack
    prometheus: kube-prometheus-stack-prometheus
spec:
  selector:
    matchLabels:
      k8s-app: hubble
  targetLabels:
    - k8s-app
  namespaceSelector:
    matchNames:
      - kube-system
  endpoints:
    - port: hubble-metrics
      interval: 30s
      path: /metrics
---
# Cilium operator (:9963)
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: cilium-operator
  namespace: monitoring
  labels:
    app.kubernetes.io/name: cilium-operator
    prometheus: kube-prometheus-stack-prometheus
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      name: cilium-operator
  namespaceSelector:
    matchNames:
      - kube-system
  endpoints:
    - port: metrics
      interval: 30s
      path: /metrics
---
# Cilium Envoy (Gateway API L7). The cilium-envoy Service exists (port
# envoy-metrics:9964), so a ServiceMonitor works here.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: cilium-envoy-metrics
  namespace: monitoring
  labels:
    app.kubernetes.io/name: cilium-envoy
    release: kube-prometheus-stack
    prometheus: kube-prometheus-stack-prometheus
spec:
  selector:
    matchLabels:
      k8s-app: cilium-envoy
  targetLabels:
    - k8s-app
  namespaceSelector:
    matchNames:
      - kube-system
  endpoints:
    - port: envoy-metrics
      interval: 30s
      path: /metrics
