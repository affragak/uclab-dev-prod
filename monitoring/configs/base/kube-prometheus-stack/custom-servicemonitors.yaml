# Cilium/Hubble metrics scraping.
#
# NOTE: Cilium's built-in ServiceMonitors are disabled (they require the
# monitoring.coreos.com CRDs at CNI-install time, which breaks a cold bootstrap
# — see the DR notes). Cilium only creates the agent/operator metrics *Services*
# when its serviceMonitor is enabled, so we scrape the pods directly with
# PodMonitors instead (no Service needed). prometheus.enabled=true keeps the
# metrics ports open on the pods.
#
# Prometheus discovers these because kube-prometheus-stack sets
# podMonitorSelectorNilUsesHelmValues=false / serviceMonitorSelectorNilUsesHelmValues=false.

# Cilium agent (:9962 "prometheus") AND Hubble (:9965 "hubble-metrics") —
# both ports live on the cilium-agent pod (k8s-app=cilium).
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: cilium-agent
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      k8s-app: cilium
  namespaceSelector:
    matchNames:
      - kube-system
  podMetricsEndpoints:
    - port: prometheus
      interval: 30s
      path: /metrics
    - port: hubble-metrics
      interval: 30s
      path: /metrics
---
# Cilium operator (:9963 "prometheus")
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: cilium-operator
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      name: cilium-operator
  namespaceSelector:
    matchNames:
      - kube-system
  podMetricsEndpoints:
    - port: prometheus
      interval: 30s
      path: /metrics
---
# Cilium Envoy (Gateway API L7). The cilium-envoy Service exists (port
# envoy-metrics:9964), so a ServiceMonitor works here.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: cilium-envoy-metrics
  namespace: monitoring
  labels:
    app.kubernetes.io/name: cilium-envoy
    release: kube-prometheus-stack
    prometheus: kube-prometheus-stack-prometheus
spec:
  selector:
    matchLabels:
      k8s-app: cilium-envoy
  namespaceSelector:
    matchNames:
      - kube-system
  endpoints:
    - port: envoy-metrics
      interval: 30s
      path: /metrics
