apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy
  namespace: flux-system
spec:
  targetNamespace: monitoring
  releaseName: alloy
  interval: 1h
  chart:
    spec:
      chart: alloy
      version: "1.12.1"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system

  valuesFrom:
    - kind: ConfigMap
      name: alloy-values
