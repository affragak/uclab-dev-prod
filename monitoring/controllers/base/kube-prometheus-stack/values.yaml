prometheus:
  prometheusSpec:
    scrapeInterval: 30s
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    retention: 15d
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi
kubeEtcd:
  enabled: true
  endpoints:
    - 10.10.10.198 # 3 control-plane IPs
    - 10.10.10.199
    - 10.10.10.192
  service:
    enabled: true
    port: 2381
    targetPort: 2381
  serviceMonitor:
    enabled: true
    scheme: http

grafana:
  persistence:
    enabled: true
    storageClassName: longhorn
    size: 5Gi
  # don't hardcode a password like the source repo's default `prom-operator` —
  # wire this through your existing ESO + Vault pattern instead
  admin:
    existingSecret: grafana-admin-creds
    userKey: admin-user
    passwordKey: admin-password
  additionalDataSources:
    - name: Loki
      type: loki
      url: http://loki-gateway.monitoring.svc.cluster.local
      access: proxy
  # Land on the curated cockpit instead of Grafana's stock home page.
  # The dashboard sidecar writes each ConfigMap's data key into /tmp/dashboards/,
  # so this path matches the performance-cockpit.json key.
  grafana.ini:
    dashboards:
      default_home_dashboard_path: /tmp/dashboards/performance-cockpit.json
