prometheus:
  prometheusSpec:
    scrapeInterval: 30s
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    retention: 15d
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi
# Cilium runs in kube-proxy-replacement mode — there is no kube-proxy
# DaemonSet to scrape, so disable the component. This removes both the
# kube-proxy ServiceMonitor and the KubeProxyDown alert rule (which would
# otherwise fire forever against a target that will never exist).
kubeProxy:
  enabled: false

kubeEtcd:
  enabled: true
  # NOTE: hardcoded control-plane IPs — these change when control-plane nodes
  # are recreated. If kube-etcd targets go DOWN, re-check `kubectl get nodes -o wide`
  # and update these. Also requires Talos etcd `listen-metrics-urls: http://0.0.0.0:2381`.
  endpoints:
    - 10.10.10.167 # 3 control-plane IPs
    - 10.10.10.169
    - 10.10.10.171
  service:
    enabled: true
    port: 2381
    targetPort: 2381
  serviceMonitor:
    enabled: true
    scheme: http

grafana:
  # Drop the ~27 bundled kube-prometheus-stack dashboards; we curate our own set
  # (performance-cockpit, cilium/hubble, cnpg, longhorn, flux, node-exporter-full,
  # etc.) as grafana_dashboard ConfigMaps under monitoring/configs.
  defaultDashboardsEnabled: false
  persistence:
    enabled: true
    storageClassName: longhorn
    size: 5Gi
  # The PVC is ReadWriteOnce; RollingUpdate would try to attach it to the new
  # pod while the old one still holds it (Multi-Attach deadlock across nodes).
  # Recreate terminates the old pod first.
  deploymentStrategy:
    type: Recreate
  # don't hardcode a password like the source repo's default `prom-operator` —
  # wire this through your existing ESO + Vault pattern instead
  admin:
    existingSecret: grafana-admin-creds
    userKey: admin-user
    passwordKey: admin-password
  additionalDataSources:
    - name: Loki
      type: loki
      url: http://loki-gateway.monitoring.svc.cluster.local
      access: proxy
  # Land on the curated cockpit instead of Grafana's stock home page.
  # The dashboard sidecar writes each ConfigMap's data key into /tmp/dashboards/,
  # so this path matches the performance-cockpit.json key.
  grafana.ini:
    dashboards:
      default_home_dashboard_path: /tmp/dashboards/performance-cockpit.json

# Route Prometheus alerts to Slack. The webhook URL is synced from Vault by the
# alertmanager-slack-webhook ExternalSecret and mounted (via alertmanagerSpec.secrets)
# at /etc/alertmanager/secrets/alertmanager-slack-webhook/webhook-url — referenced
# with slack_api_url_file so the URL never lands in Git.
alertmanager:
  alertmanagerSpec:
    secrets:
      - alertmanager-slack-webhook
  config:
    global:
      slack_api_url_file: /etc/alertmanager/secrets/alertmanager-slack-webhook/webhook-url
      resolve_timeout: 5m
    route:
      receiver: slack
      group_by: [alertname, namespace]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        # Watchdog is an always-firing heartbeat — keep it out of Slack.
        - matchers:
            - alertname = "Watchdog"
          receiver: "null"
    receivers:
      - name: "null"
      - name: slack
        slack_configs:
          - channel: "#talos-uclab-dev-prod"
            send_resolved: true
            title: '[{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] {{ .CommonLabels.alertname }}'
            text: |-
              {{ range .Alerts }}*{{ .Labels.severity }}* — {{ .Annotations.summary }}
              {{ .Annotations.description }}
              {{ if .Labels.namespace }}ns: `{{ .Labels.namespace }}`{{ end }}
              {{ end }}

# Flux custom-resource metrics via kube-state-metrics (gotk_reconcile_condition,
# gotk_suspend_status, gotk_resource_info) — required by the Flux "Cluster Stats"
# dashboard. NOTE: standard KSM collectors are intentionally LEFT ENABLED (we do
# NOT set --custom-resource-state-only), so existing kube_* metrics keep working.
# Source: fluxcd/flux2-monitoring-example.
kube-state-metrics:
  rbac:
    extraRules:
      - apiGroups:
          - source.toolkit.fluxcd.io
          - kustomize.toolkit.fluxcd.io
          - helm.toolkit.fluxcd.io
          - notification.toolkit.fluxcd.io
          - image.toolkit.fluxcd.io
        resources:
          - gitrepositories
          - buckets
          - helmrepositories
          - helmcharts
          - ocirepositories
          - kustomizations
          - helmreleases
          - alerts
          - providers
          - receivers
          - imagerepositories
          - imagepolicies
          - imageupdateautomations
        verbs: [ "list", "watch" ]
  customResourceState:
    enabled: true
    config:
      spec:
        resources:
          - groupVersionKind:
              group: kustomize.toolkit.fluxcd.io
              version: v1
              kind: Kustomization
            metricNamePrefix: gotk
            metrics:
              - name: "resource_info"
                help: "The current state of a Flux Kustomization resource."
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      name: [ metadata, name ]
                labelsFromPath:
                  exported_namespace: [ metadata, namespace ]
                  ready: [ status, conditions, "[type=Ready]", status ]
                  suspended: [ spec, suspend ]
                  revision: [ status, lastAppliedRevision ]
                  source_name: [ spec, sourceRef, name ]
          - groupVersionKind:
              group: helm.toolkit.fluxcd.io
              version: v2
              kind: HelmRelease
            metricNamePrefix: gotk
            metrics:
              - name: "resource_info"
                help: "The current state of a Flux HelmRelease resource."
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      name: [ metadata, name ]
                labelsFromPath:
                  exported_namespace: [ metadata, namespace ]
                  ready: [ status, conditions, "[type=Ready]", status ]
                  suspended: [ spec, suspend ]
                  revision: [ status, history, "0", chartVersion ]
                  chart_name: [ status, history, "0", chartName ]
                  chart_app_version: [ status, history, "0", appVersion ]
                  chart_ref_name: [ spec, chartRef, name ]
                  chart_source_name: [ spec, chart, spec, sourceRef, name ]
          - groupVersionKind:
              group: source.toolkit.fluxcd.io
              version: v1
              kind: GitRepository
            metricNamePrefix: gotk
            metrics:
              - name: "resource_info"
                help: "The current state of a Flux GitRepository resource."
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      name: [ metadata, name ]
                labelsFromPath:
                  exported_namespace: [ metadata, namespace ]
                  ready: [ status, conditions, "[type=Ready]", status ]
                  suspended: [ spec, suspend ]
                  revision: [ status, artifact, revision ]
                  url: [ spec, url ]
          - groupVersionKind:
              group: source.toolkit.fluxcd.io
              version: v1
              kind: Bucket
            metricNamePrefix: gotk
            metrics:
              - name: "resource_info"
                help: "The current state of a Flux Bucket resource."
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      name: [ metadata, name ]
                labelsFromPath:
                  exported_namespace: [ metadata, namespace ]
                  ready: [ status, conditions, "[type=Ready]", status ]
                  suspended: [ spec, suspend ]
                  revision: [ status, artifact, revision ]
                  endpoint: [ spec, endpoint ]
                  bucket_name: [ spec, bucketName ]
          - groupVersionKind:
              group: source.toolkit.fluxcd.io
              version: v1
              kind: HelmRepository
            metricNamePrefix: gotk
            metrics:
              - name: "resource_info"
                help: "The current state of a Flux HelmRepository resource."
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      name: [ metadata, name ]
                labelsFromPath:
                  exported_namespace: [ metadata, namespace ]
                  ready: [ status, conditions, "[type=Ready]", status ]
                  suspended: [ spec, suspend ]
                  revision: [ status, artifact, revision ]
                  url: [ spec, url ]
          - groupVersionKind:
              group: source.toolkit.fluxcd.io
              version: v1
              kind: HelmChart
            metricNamePrefix: gotk
            metrics:
              - name: "resource_info"
                help: "The current state of a Flux HelmChart resource."
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      name: [ metadata, name ]
                labelsFromPath:
                  exported_namespace: [ metadata, namespace ]
                  ready: [ status, conditions, "[type=Ready]", status ]
                  suspended: [ spec, suspend ]
                  revision: [ status, artifact, revision ]
                  chart_name: [ spec, chart ]
                  chart_version: [ spec, version ]
          - groupVersionKind:
              group: source.toolkit.fluxcd.io
              version: v1
              kind: OCIRepository
            metricNamePrefix: gotk
            metrics:
              - name: "resource_info"
                help: "The current state of a Flux OCIRepository resource."
