machine:
  kubelet:
    extraArgs:
      rotate-server-certificates: true
cluster:
  proxy:
    disabled: true
  extraManifests:
    - https://raw.githubusercontent.com/alex1989hu/kubelet-serving-cert-approver/main/deploy/standalone-install.yaml
    - https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
    # Gateway API CRDs — Cilium (gatewayAPI.enabled) REQUIRES these at install
    # but does not ship them. Applying at Talos bootstrap guarantees they exist
    # before the CNI install, so a rebuild needs no manual `kubectl apply` of
    # the Gateway API CRDs (a gap that stalled the DR rebuild).
    - https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.6.1/standard-install.yaml
  network:
    cni:
      name: none
