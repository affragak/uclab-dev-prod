apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: linkding
  namespace: linkding
spec:
  parentRefs:
    - name: uclab-gateway
      namespace: gateway-system
  hostnames:
    - linkding.uclab.dev
  rules:
    - backendRefs:
        - name: linkding
          port: 9090 # matches the service port from your original cloudflared config.yaml
