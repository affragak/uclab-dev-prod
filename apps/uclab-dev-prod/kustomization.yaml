apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - forgejo
  - forgejo-runner
  - n8n
  - linkding
  # hugoblog is intentionally NOT here — it has its own Flux Kustomization
  # (clusters/.../apps.yaml) that dependsOn `apps`, because its image lives in
  # the in-cluster Forgejo registry. Keeping it in this atomic set let a
  # registry-not-ready / signature-denied hugoblog block forgejo's own recovery.
