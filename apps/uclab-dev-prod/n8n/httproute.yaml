apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: n8n
  namespace: n8n
spec:
  parentRefs:
    - name: uclab-gateway
      namespace: gateway-system
  hostnames:
    - n8n.uclab.dev
  rules:
    - backendRefs:
        - name: n8n
          port: 3008 # matches the service port from your original cloudflared config.yaml
