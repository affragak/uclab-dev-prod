apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: botkube
  namespace: botkube
spec:
  targetNamespace: botkube
  interval: 15m
  chart:
    spec:
      chart: botkube
      version: 1.*
      sourceRef:
        kind: HelmRepository
        name: botkube
        namespace: botkube
  valuesFrom:
    - kind: ConfigMap
      name: botkube-values
  # The botkube chart runs uid/gid 101 with readOnlyRootFilesystem and exposes
  # no fsGroup value, so the Longhorn plugin-cache PVC mounts root-owned and the
  # plugin manager can't write it. Inject fsGroup post-render so the kubelet
  # chowns the volume to gid 101.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: botkube-botkube
            patch: |
              - op: add
                path: /spec/template/spec/securityContext/fsGroup
                value: 101
