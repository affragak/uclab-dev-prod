## Format: communications.{alias}
communications:
  "default-group":
    socketSlack:
      enabled: true
      channels:
        "default":
          name: "talos-uclab-dev-prod" # Your Slack channel name (lowercase)
          bindings:
            executors:
              - k8s-default-tools
            sources:
              - k8s-err-events
              - k8s-recommendation-events
      botToken: "" # Will be overridden by existingCommunicationsSecretName
      appToken: ""

## Executors. The chart ships botkube/kubectl DISABLED by default, so the
## `k`/`kubectl` aliases silently do nothing. Enable it here (RBAC comes from
## the botkube-plugins-default group, which has get/watch/list on all resources).
executors:
  k8s-default-tools:
    botkube/kubectl:
      enabled: true

## Global Botkube configuration
settings:
  clusterName: uclab-dev-prod # Customize your cluster name
  # TEMP: debug to confirm whether Slack is delivering incoming message events
  # over Socket Mode. Revert to info once the bot responds.
  log:
    level: debug

# Use existing secret for communications config
existingCommunicationsSecretName: "botkube-slack-secrets"

# NOTE: fsGroup (needed so uid 101 can write the plugin-cache PVC) is NOT set
# here — the chart hardcodes only runAsUser/runAsGroup and silently drops
# securityContext.fsGroup. It is injected via the HelmRelease postRenderer in
# release.yaml instead.

# Mount PVC for plugin caching. NOTE: the chart already mounts an emptyDir at
# /tmp (cache-volume), so mounting the PVC there too creates a duplicate
# volumeMount and Helm refuses to apply. Use a dedicated path and point
# botkube's plugin cacheDir at it (default cacheDir is /tmp).
extraVolumes:
  - name: plugins-cache
    persistentVolumeClaim:
      claimName: botkube-plugins-cache

extraVolumeMounts:
  - name: plugins-cache
    mountPath: /plugin-cache

# Persist downloaded plugins on the PVC instead of the ephemeral /tmp emptyDir.
plugins:
  cacheDir: /plugin-cache

# Increase health check timeouts for slower Pi hardware
deployment:
  livenessProbe:
    initialDelaySeconds: 180 # 3 minutes
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 12
  readinessProbe:
    initialDelaySeconds: 180
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 12
