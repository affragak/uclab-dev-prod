apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: n8n-db
  # name: customer1-db2
spec:
  instances: 3

  monitoring:
    enablePodMonitor: true

  bootstrap:
    initdb:
      database: app
      owner: app
      secret:
        name: n8n-db-credentials

  # bootstrap:
  #   recovery:
  #     database: app
  #     owner: app
  #     source: source
  #     secret:
  #       name: customer1-db-credentials
  #
  # externalClusters:
  #   - name: source
  #     plugin:
  #       name: barman-cloud.cloudnative-pg.io
  #       parameters:
  #         barmanObjectName: customer1-objectstore
  #         serverName: customer1-db

  storage:
    size: 5Gi

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        # Was "n8n-objectstore" (never created — objectstore.yaml is commented
        # out in kustomization.yaml), which broke WAL archiving. Point at the
        # objectstore that actually exists so archiving resumes and a base
        # backup can be taken before any future rename/recovery.
        barmanObjectName: minio-objectstore

