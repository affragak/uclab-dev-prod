---
# Option 1: Split secrets (RECOMMENDED)
# ExternalSecret for DB credentials with proper type
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: n8n-db-credentials
  namespace: n8n
spec:
  refreshInterval: "15s"
  secretStoreRef:
    name: vault-backend-global
    kind: ClusterSecretStore
  target:
    name: n8n-db-credentials
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth  # CNPG prefers this type
  data:
    - secretKey: username
      remoteRef:
        key: n8n-secrets/n8n-db-credentials
        property: username
    - secretKey: password
      remoteRef:
        key: n8n-secrets/n8n-db-credentials
        property: password

---
# ExternalSecret for N8N env vars
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: n8n-env
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend-global
    kind: ClusterSecretStore
  target:
    name: n8n-env
    creationPolicy: Owner
  data:
    - secretKey: DB_POSTGRESDB_USER
      remoteRef:
        key: n8n-secrets/n8n-env
        property: DB_POSTGRESDB_USER
    - secretKey: DB_POSTGRESDB_PASSWORD
      remoteRef:
        key: n8n-secrets/n8n-env
        property: DB_POSTGRESDB_PASSWORD