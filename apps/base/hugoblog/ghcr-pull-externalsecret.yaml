# Recreates the image-pull secret the hugoblog deployment references
# (imagePullSecrets: ghcr-pull) from Vault, so pulling the private
# ghcr.io/affragak/uclab image works without a hand-created secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-pull
spec:
  refreshInterval: "15s"
  secretStoreRef:
    name: vault-backend-global
    kind: ClusterSecretStore
  target:
    name: ghcr-pull
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths":{"{{ .server }}":{"username":"{{ .username }}","password":"{{ .password }}","auth":"{{ printf "%s:%s" .username .password | b64enc }}"}}}
  data:
    - secretKey: server
      remoteRef:
        key: ghcr-pull
        property: server
    - secretKey: username
      remoteRef:
        key: ghcr-pull
        property: username
    - secretKey: password
      remoteRef:
        key: ghcr-pull
        property: password
