apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: forgejo-runner-docker-cache
  namespace: forgejo-runner
spec:
  # RWO (Longhorn block/ext4) — DinD's overlay snapshotter cannot mount
  # overlayfs on the NFS-backed RWX volume ("overlay ... invalid argument").
  # The runner is a single replica (Recreate), so RWX was never needed.
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
