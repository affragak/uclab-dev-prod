# Requires the hugoblog image to be cosign-signed with our public key.
# mode: enforce — unsigned/unverifiable images (matching the glob) are denied
# admission. Only namespaces labeled policy.sigstore.dev/include=true are
# evaluated. Verified in warn mode first: the signed digest passes, the glob
# matches (a tag ref is denied "must be an image digest").
apiVersion: policy.sigstore.dev/v1beta1
kind: ClusterImagePolicy
metadata:
  name: uclab-image-policy
spec:
  mode: enforce
  images:
    - glob: "forgejo.uclab.dev/antonis/uclab**"
  authorities:
    - name: uclab
      key:
        data: |
          -----BEGIN PUBLIC KEY-----
          MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEw+BoXkLVh1ILZm8KiJsITbWeSwf5
          AfvKw/0p4hHGEdfsk4Fh6rLFKOyEoIkAtDtyA7XWlDOFUG2+jkE+LUUE2A==
          -----END PUBLIC KEY-----
