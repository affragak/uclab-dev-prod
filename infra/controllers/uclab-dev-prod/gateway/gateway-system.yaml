apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: uclab-gateway
  namespace: gateway-system
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
spec:
  gatewayClassName: cilium
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      hostname: "*.uclab.dev"
      allowedRoutes:
        namespaces:
          from: All
    - name: https
      port: 443
      protocol: HTTPS
      hostname: "*.uclab.dev"
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: uclab-wildcard-tls
      allowedRoutes:
        namespaces:
          from: All
